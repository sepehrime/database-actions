<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Expense tracker</h1>

    <section>
      <h2>Add expense</h2>
      <form id="add-form">
        <input name="description" placeholder="Description" required>
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
        <input name="spent_on" type="date" required>
        <select name="category_id" required></select>
        <button type="submit">Add</button>
      </form>
      <p id="form-error" class="error"></p>
    </section>

    <div class="totals">
      <section>
        <h2>By category</h2>
        <table id="by-category"><tbody></tbody></table>
      </section>
      <section>
        <h2>By month</h2>
        <table id="by-month"><tbody></tbody></table>
      </section>
    </div>

    <section>
      <h2>Expenses</h2>
      <table id="expenses">
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
